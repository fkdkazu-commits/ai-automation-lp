name: Deploy to GitHub Pages

# main への push でビルドし、GitHub Pages へ公開する。
# リポジトリ設定 → Pages → Source を "GitHub Actions" にしておくこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のデプロイはキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pages が未設定なら有効化する（enablement: true）。設定済みなら何もしない
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # npm install → astro build → dist/ を Pages 用アーティファクトとしてアップロードまで行う
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
