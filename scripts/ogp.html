<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif;
    background:linear-gradient(135deg,#1a1714 0%,#2d2620 45%,#d4622a 100%);
    position:relative;color:#fff;
  }
  .orb{position:absolute;border-radius:50%;filter:blur(60px);}
  .orb1{width:520px;height:520px;background:rgba(232,132,78,.35);top:-160px;right:-120px;}
  .orb2{width:420px;height:420px;background:rgba(232,164,114,.22);bottom:-180px;left:-120px;}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);background-size:26px 26px;}
  .inner{position:relative;z-index:2;padding:86px 88px;height:100%;display:flex;flex-direction:column;justify-content:center;}
  .bar{width:96px;height:6px;background:#e8844e;border-radius:3px;margin-bottom:22px;}
  .label{font-size:19px;font-weight:700;letter-spacing:.18em;color:#e8a472;margin-bottom:26px;}
  h1{font-size:58px;font-weight:900;line-height:1.32;letter-spacing:-.02em;}
  h1 em{font-style:normal;color:#e8a472;}
  .sub{font-size:22px;color:rgba(255,255,255,.78);margin-top:26px;font-weight:500;}
  .foot{display:flex;align-items:center;gap:16px;margin-top:44px;}
  .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#d4622a,#e8844e);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .name{font-size:23px;font-weight:900;letter-spacing:.01em;}
  .name span{display:block;font-size:14px;font-weight:500;color:rgba(255,255,255,.6);margin-top:3px;letter-spacing:.06em;}
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="grid"></div>
  <div class="inner">
    <div class="bar"></div>
    <div class="label">AI BUSINESS AUTOMATION</div>
    <h1>業務の無駄を削ぎ落とし、<br><em>AIが働く仕組み</em>をつくる。</h1>
    <div class="sub">Claude Code × AWS で、御社の生産性を変える</div>
    <div class="foot">
      <div class="mark">F</div>
      <div class="name">福田 和弘<span>AI業務自動化支援 / AI顧問</span></div>
    </div>
  </div>
</body>
</html>
